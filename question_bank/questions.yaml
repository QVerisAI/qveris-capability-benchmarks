  - question_id: stock-quote-aapl-current
    cap_id: stock-quote
    role: core_positive
    task: Return the current quote for AAPL with an as-of timestamp.
    input: {symbol: AAPL}
    required_observations: [symbol, price, timestamp]
    completion_conditions: [symbol, price, timestamp]
    source_ids: [finsearchcomp-2026, nasdaq-market-activity]
    scenario_refs:
      - {scenario_id: company-research-agent, version: 1.0.0}
      - {scenario_id: company-research-agent, version: 1.1.0}
    evaluation_contract:
      market: us-equities
      language: en
      as_of: execution-time
      reference_source_ids: [nasdaq-market-activity]
      reference_rule: Confirm the symbol, positive price, currency context, and quote timestamp against the disclosed market reference.
      tolerance_rule: During the regular session, require quote age at most 15 minutes and absolute price difference at most the greater of USD 0.05 or 1 percent; outside the session use the latest disclosed close and timestamp.
      interface_expectations: [typed-symbol, numeric-price, explicit-timestamp, explicit-empty-state]
      selection_implication: Passing supports current-quote integration for the disclosed market and freshness window.
    text_origin: qveris_curated
    selection_rationale: Isolates current price retrieval from research or trading advice.
    review_status: approved
