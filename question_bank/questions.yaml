  - question_id: stock-quote-600519-market-coverage
    cap_id: stock-quote
    role: coverage
    task: Return the current quote for 600519.SH with its market identity and quote timestamp.
    input: {symbol: 600519.SH, market: CN}
    required_observations: [symbol, market, price, currency, timestamp]
    completion_conditions: [symbol, market, price, timestamp]
    source_ids: [sse-official-market-data]
    scenario_refs: [{scenario_id: company-research-agent, version: 1.1.0}]
    evaluation_contract:
      market: cn-equities
      language: en
      as_of: execution-time
      reference_source_ids: [sse-official-market-data]
      reference_rule: Use the CAP-owned canonical identity 600519.SH -> 贵州茅台 (XSHG Main Board A-share, per the Shanghai Stock Exchange stock-code allocation); require the canonical exchange symbol, positive CNY price, and an explicit quote timestamp consistent with the SSE official market-data source.
      tolerance_rule: Require the latest disclosed SSE trading-session value with an explicit timestamp; do not substitute a different security, exchange, currency, stale undated value, or inferred value.
      interface_expectations: [canonical-market-symbol, numeric-price, explicit-currency, explicit-timestamp]
      selection_implication: Passing supports an SSE Main Board single-security quote integration in the disclosed freshness window; it does not generalize to other mainland-China exchanges or instruments.
    text_origin: qveris_curated
    selection_rationale: Exposes whether a quote path expands beyond US equities without conflating market coverage with aggregate quality.
    review_status: approved
