    cap_id: realtime-financial-news
    role: core_positive
    task: Return current financial news mentioning AAPL with a headline and publication timestamp.
    input: {symbol: AAPL, limit: 5}
    required_observations: [title, source, published_at, summary]
    completion_conditions: [title, source, published_at]
    source_ids: [harbor-capability-catalog]
    text_origin: qveris_curated
    selection_rationale: Derived from the NEWS.FIN.REALTIME contract's query and event fields.
    review_status: approved
