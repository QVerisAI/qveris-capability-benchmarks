    required_observations: [symbol, price, currency, timestamp]
    completion_conditions: [symbol, price, currency, timestamp]
    source_ids: [nasdaq-market-activity]
    scenario_refs: [{scenario_id: company-research-agent, version: 1.1.0}]
    evaluation_contract:
      market: us-equities
      language: en
      as_of: execution-time
      reference_source_ids: [nasdaq-market-activity]
      reference_rule: Capture the reference price and quote timestamp from the disclosed Nasdaq market source at execution time and confirm the symbol, currency, positive price, and timestamp against it.
      tolerance_rule: During the regular session, require quote age at most 15 minutes and absolute price difference at most the greater of USD 0.05 or 1 percent; outside the session use the latest disclosed close and timestamp.
      interface_expectations: [typed-symbol, numeric-price, explicit-currency, explicit-timestamp]
      selection_implication: Passing supports latency-sensitive US quote retrieval within the disclosed freshness and precision window.
    text_origin: qveris_curated
    selection_rationale: Makes freshness and numeric precision independently visible to developers selecting a quote path.
    review_status: approved
  - question_id: stock-quote-600519-market-coverage
    cap_id: stock-quote
    role: coverage
    task: Return the current quote for 600519.SH with its market identity and quote timestamp.
    input: {symbol: 600519.SH, market: CN}
    required_observations: [symbol, market, price, currency, timestamp]
    completion_conditions: [symbol, market, price, timestamp]
    source_ids: [sse-official-market-data]
    scenario_refs: [{scenario_id: company-research-agent, version: 1.1.0}]
    evaluation_contract:
      market: cn-equities
      language: en
      as_of: execution-time
      reference_source_ids: [sse-official-market-data]
      reference_rule: Use the CAP-owned canonical identity 600519.SH -> 贵州茅台 (XSHG Main Board A-share, per the Shanghai Stock Exchange stock-code allocation); require the canonical exchange symbol, positive CNY price, and an explicit quote timestamp consistent with the SSE official market-data source.
      tolerance_rule: Require the latest disclosed SSE trading-session value with an explicit timestamp; do not substitute a different security, exchange, currency, stale undated value, or inferred value.
      interface_expectations: [canonical-market-symbol, numeric-price, explicit-currency, explicit-timestamp]
      selection_implication: Passing supports an SSE Main Board single-security quote integration in the disclosed freshness window; it does not generalize to other mainland-China exchanges or instruments.
    text_origin: qveris_curated
    selection_rationale: Exposes whether a quote path expands beyond US equities without conflating market coverage with aggregate quality.
    review_status: approved
  - question_id: stock-quote-600519-agent-contract
    cap_id: stock-quote
    role: agent_contract
    task: For the Chinese-language request 获取贵州茅台当前价格和报价时间, resolve the issuer to the canonical security and return its current quote and quote timestamp through exactly one fixed tool call.
    input: {symbol: 600519.SH, market: CN, fields: [price, quote_time]}
    required_observations: [symbol, price, timestamp]
    completion_conditions: [symbol, price, timestamp]
    source_ids: [sse-official-market-data]
    scenario_refs: [{scenario_id: company-research-agent, version: 1.1.0}]
    evaluation_contract:
      market: cn-equities
      language: zh-CN
      as_of: execution-time
      reference_source_ids: [sse-official-market-data]
      reference_rule: Use the CAP-owned canonical identity 600519.SH -> 贵州茅台 (XSHG Main Board A-share); require a positive current quote with an explicit quote timestamp consistent with the SSE official market-data source.
      tolerance_rule: The first and only tool call must contain a valid canonical symbol and request both price and quote time; no discovery or repair call is permitted.
      interface_expectations: [single-tool-call, canonical-market-symbol, valid-first-call-arguments, typed-quote-output]
      selection_implication: Passing supports deterministic one-call Agent integration for the canonical direct input after the Agent has resolved the Chinese-language request.
    text_origin: qveris_curated
    selection_rationale: Measures argument validity and one-call completion while keeping the question independent of the evaluated Provider.
    review_status: approved
