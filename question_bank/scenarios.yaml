scenarios:
  - scenario_id: company-research-agent
    version: 1.0.0
    name: Company Research Agent
    developer_decision: Select evidence-backed data paths for a company research Agent.
    target_users: [financial-agent-developers]
    markets: [united-states, mainland-china]
    languages: [english, simplified-chinese]
    required_capabilities:
      - cap_id: stock-quote
        priority: p0
        minimum_question_roles: [core_positive, boundary_negative, coverage, freshness_precision, agent_contract]
      - cap_id: financial-statement-facts
        priority: p0
        minimum_question_roles: [core_positive, boundary_negative]
      - cap_id: sec-filing-evidence
        priority: p0
        minimum_question_roles: [core_positive, boundary_negative]
      - cap_id: historical-price-series
        priority: p1
        minimum_question_roles: [core_positive, boundary_negative]
      - cap_id: company-fundamentals
        priority: p1
        minimum_question_roles: [core_positive, boundary_negative]
      - cap_id: financial-news-evidence
        priority: p2
        minimum_question_roles: [core_positive, boundary_negative]
    completion_policy:
      required_priorities: [p0]
      required_release_state: verified
      missing_dimension_state: evidence_insufficient
    source_ids: [financebench, finsearchcomp-2026, icbcbench]
    review_status: approved
