tools:
  - tool_id: eodhd.financial_apis.dividends.retrieve.v1.8b52cd2a
    provider_id: eodhd
    access_path_id: eodhd-dividends-qveris
    name: Retrieve Dividends History
    description: Retrieve historical dividend events for a symbol.
    params:
      - {name: symbol, type: string, required: true, description: Symbol}
      - {name: from, type: string, required: false, description: Start date YYYY-MM-DD}
      - {name: to, type: string, required: false, description: End date YYYY-MM-DD}
      - {name: fmt, type: string, required: false, description: Output format}
    questions:
      - question_id: dividend-aapl-history
        task: Return AAPL dividend events in the past year.
        expected_params: {symbol: AAPL}
  - tool_id: twelvedata.dividends.retrieve.v1.c0c9b142
    provider_id: twelve-data
    access_path_id: twelve-data-dividends-qveris
    name: Dividends
    description: Return dividend history for a symbol.
    params:
      - {name: symbol, type: string, required: false, description: Ticker symbol}
      - {name: start_date, type: string, required: false, description: Start date YYYY-MM-DD}
      - {name: end_date, type: string, required: false, description: End date YYYY-MM-DD}
      - {name: range, type: string, required: false, description: Range preset}
    questions:
      - question_id: dividend-aapl-history
        task: Return AAPL dividend events in the past year.
        expected_params: {symbol: AAPL}
  - tool_id: polygon.stocks.dividends.list.v1.ea25c492
    provider_id: massive-stocks
    access_path_id: massive-stocks-dividends-qveris
    name: List Stock Dividends
    description: List historical dividend events, filterable by ticker and ex-dividend date.
    params:
      - {name: ticker, type: string, required: false, description: Ticker symbol}
      - {name: ex_dividend_date.gte, type: string, required: false, description: Ex-dividend date from}
      - {name: ex_dividend_date.lte, type: string, required: false, description: Ex-dividend date to}
      - {name: limit, type: integer, required: false, description: Max results}
    questions:
      - question_id: dividend-aapl-history
        task: Return AAPL dividend events in the past year.
        expected_params: {ticker: AAPL}
  - tool_id: alphavantage.dividends.list.v1.467a92c0
    provider_id: alpha-vantage
    access_path_id: alpha-vantage-dividends-qveris
    name: Corporate Action Dividends
    description: Retrieve corporate action dividend events for a symbol.
    params:
      - {name: function, type: string, required: true, description: The function of your choice. DIVIDENDS}
      - {name: symbol, type: string, required: true, description: The symbol of the ticker}
      - {name: datatype, type: string, required: false, description: Output format}
    questions:
      - question_id: dividend-aapl-history
        task: Return AAPL dividend events in the past year.
        expected_params: {function: DIVIDENDS, symbol: AAPL}
