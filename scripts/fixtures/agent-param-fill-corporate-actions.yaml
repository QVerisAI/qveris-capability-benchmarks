tools:
  - tool_id: eodhd.financial_apis.splits.retrieve.v1.b2ac7c39
    provider_id: eodhd
    access_path_id: eodhd-corporate-actions-qveris
    name: Retrieve Historical Stock Splits
    description: Retrieve historical stock split events for a symbol.
    params:
      - {name: symbol, type: string, required: true, description: Symbol}
      - {name: from, type: string, required: false, description: Start date YYYY-MM-DD}
      - {name: to, type: string, required: false, description: End date YYYY-MM-DD}
      - {name: fmt, type: string, required: false, description: Output format}
    questions:
      - question_id: corp-actions-aapl-splits
        task: Return AAPL stock split events in the past year.
        expected_params: {symbol: AAPL}
  - tool_id: massive_stocks.stocks.splits.list.v1.9ba1ffe4
    provider_id: massive-stocks
    access_path_id: massive-stocks-corporate-actions-qveris
    name: List Stock Splits
    description: List historical stock split events, filterable by ticker and execution date.
    params:
      - {name: ticker, type: string, required: false, description: Ticker symbol}
      - {name: execution_date.gte, type: string, required: false, description: Execution date from}
      - {name: execution_date.lte, type: string, required: false, description: Execution date to}
      - {name: limit, type: integer, required: false, description: Max results}
      - {name: sort, type: string, required: false, description: Sort order}
    questions:
      - question_id: corp-actions-aapl-splits
        task: Return AAPL stock split events in the past year.
        expected_params: {ticker: AAPL}
  - tool_id: twelvedata.splits.retrieve.v1.43527690
    provider_id: twelve-data
    access_path_id: twelve-data-corporate-actions-qveris
    name: Splits
    description: Return split events for a symbol or identifier.
    params:
      - {name: symbol, type: string, required: false, description: Ticker symbol}
      - {name: start_date, type: string, required: false, description: Start date YYYY-MM-DD}
      - {name: end_date, type: string, required: false, description: End date YYYY-MM-DD}
      - {name: range, type: string, required: false, description: Range preset}
    questions:
      - question_id: corp-actions-aapl-splits
        task: Return AAPL stock split events in the past year.
        expected_params: {symbol: AAPL}
  - tool_id: alphavantage.splits.list.v1.467a92c0
    provider_id: alpha-vantage
    access_path_id: alpha-vantage-corporate-actions-qveris
    name: Corporate Action Splits
    description: Retrieve corporate action split events for a symbol.
    params:
      - {name: function, type: string, required: true, description: The function of your choice. SPLITS}
      - {name: symbol, type: string, required: true, description: The symbol of the ticker}
      - {name: datatype, type: string, required: false, description: Output format}
