    description: Query dividend plans for Chinese listed companies.
    params:
      - {name: codes, type: string, required: true, description: Stock codes comma separated, e.g. 600519.SH}
      - {name: year, type: integer, required: false, description: Report year}
      - {name: period, type: string, required: false, description: Report period, annual/H1/Q3/Q1}
      - {name: limit, type: integer, required: false, description: Max results}
    cases:
