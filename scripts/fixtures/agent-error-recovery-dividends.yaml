        task: 获取贵州茅台最近一次每股分红金额和除息日。
        failure_response: '{"success": true, "code": 0, "data": {"msg": "For input string: \"ZZZZZZZZ\"", "code": "500", "data": {}, "datatype": "string", "datasize": 1, "timestamp": 1786358947074}, "message": "操作成功", "timestamp": 1786358947084}'
