tools:
  - tool_id: eodhd.financial_apis.dividends.retrieve.v1.8b52cd2a
    provider_id: eodhd
    access_path_id: eodhd-dividends-qveris
    name: Retrieve Dividend History
    description: Retrieve historical dividend events for a symbol over a date range.
    params:
      - {name: symbol, type: string, required: true, description: Symbol}
      - {name: from, type: string, required: false, description: Start date YYYY-MM-DD}
      - {name: to, type: string, required: false, description: End date YYYY-MM-DD}
    cases:
      - question_id: dividend-aapl-recovery
        task: AAPL 最近一次每股分红金额和除息日是什么？
        failure_response: 'Symbol not found'
        expected_retry_params: {symbol: AAPL}
        difficulty: L2
  - tool_id: twelvedata.dividends.retrieve.v1.c0c9b142
    provider_id: twelve-data
    access_path_id: twelve-data-dividends-qveris
    name: Dividends
    description: Return dividend events for a symbol or identifier over a date range.
    params:
      - {name: symbol, type: string, required: true, description: Ticker symbol}
      - {name: start_date, type: string, required: false, description: Start date YYYY-MM-DD}
      - {name: end_date, type: string, required: false, description: End date YYYY-MM-DD}
    cases:
      - question_id: dividend-aapl-recovery
        task: AAPL 最近一次每股分红金额和除息日是什么？
        failure_response: '{"code": 404, "message": "**symbol** or **figi** parameter is missing or invalid. Please provide a valid symbol according to API documentation: https://twelvedata.com/docs#reference-data", "status": "error"}'
        expected_retry_params: {symbol: AAPL}
        difficulty: L2
  - tool_id: polygon.stocks.dividends.list.v1.ea25c492
    provider_id: massive-stocks
    access_path_id: massive-stocks-dividends-qveris
    name: List Stock Dividends
    description: List historical dividend events, filterable by ticker.
