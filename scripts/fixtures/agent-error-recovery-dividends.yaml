      - {name: ticker, type: string, required: true, description: Ticker symbol}
      - {name: limit, type: integer, required: false, description: Max results}
    cases:
      - question_id: dividend-aapl-recovery
        task: AAPL 最近一次每股分红金额和除息日是什么？
        failure_response: '{"status": "OK", "request_id": "af2fd4b8e0b24455810ac717cc2813a2", "results": []}'
        expected_retry_params: {ticker: AAPL}
        difficulty: L3
  - tool_id: alphavantage.dividends.list.v1.467a92c0
    provider_id: alpha-vantage
    access_path_id: alpha-vantage-dividends-qveris
    name: Dividends
    description: Retrieve dividend events for a ticker.
    params:
      - {name: function, type: string, required: true, description: The function of your choice. DIVIDENDS}
      - {name: symbol, type: string, required: true, description: The symbol of the ticker}
    cases:
      - question_id: dividend-aapl-recovery
        task: AAPL 最近一次每股分红金额和除息日是什么？
        failure_response: '{"symbol": "NOTASTOCK", "data": []}'
        expected_retry_params: {function: DIVIDENDS, symbol: AAPL}
        difficulty: L3
  - tool_id: hangseng_polysource.stock.dividend.query.v2.6174546b
    provider_id: hangseng
    access_path_id: hangseng-dividends-qveris
    name: Stock Dividend Query
    description: Query dividend records for Shanghai, Shenzhen, Beijing listed companies.
    params:
      - {name: stockObject, type: array, required: true, description: Stock codes or names, supporting multiple}
      - {name: beginDate, type: string, required: false, description: Start date YYYY-MM-DD}
      - {name: endDate, type: string, required: false, description: End date YYYY-MM-DD}
      - {name: pageSize, type: integer, required: false, description: Page size}
