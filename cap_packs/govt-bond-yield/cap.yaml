cap_id: govt-bond-yield
version: 1.0.0
name: Government Bond Yield
business_use: Compare frozen QVeris Access Paths for dated 10-year sovereign benchmark yields across seven representative countries.
scope:
  - Historical 10-year sovereign benchmark yield retrieval for US, CN, UK, DE, JP, AU, and CA in the fixed 2024 window.
  - Explicit unsupported-country behavior where the Access Path can express a country or series identity.
exclusions:
  - Full yield curves, central-bank policy rates, corporate bond yields, and real-time tradable prices.
  - Native APIs and candidate tools without a frozen public Provider x Access Path binding.
markets: [US, CN, UK, DE, JP, AU, CA]
asset_types: [FIXED_INCOME]
