required_fields: [symbol, filing_id, evidence, citation]
field_types:
  symbol: string
  filing_id: string
  evidence: string
  citation: string
field_constraints:
  symbol: {non_empty: true}
  filing_id: {non_empty: true}
  evidence: {non_empty: true}
  citation: {non_empty: true}
additional_fields: true
negative_control:
  required_fields: [validation_error]
  field_types:
    validation_error: string
  field_constraints:
    validation_error: {non_empty: true}
  additional_fields: false
