    question: Return a cited AAPL annual-filing passage supporting a stated risk factor.
    input: {symbol: AAPL, filing_type: 10-K, topic: supply-chain-risk}
    negative_control: false
    expected_observations: [symbol, filing_id, evidence, citation]
    completion_conditions: [filing_id, evidence, citation]
    disclosure_limits: []
    applicable_provider_ids: []
