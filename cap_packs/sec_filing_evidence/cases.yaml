    cap_id: sec-filing-evidence
    question: Resolve the request "AAPL 10-K supply chain risk" to the canonical issuer and filing form and return a cited passage through one fixed tool call.
    input: {symbol: AAPL, filing_type: 10-K, topic: supply-chain-risk}
