cap_id: corporate-actions
version: 2.0.0
name: Corporate Actions
business_use: Compare frozen QVeris Access Paths for split-event retrieval across nine representative equity markets.
scope:
  - Historical stock-split retrieval for one fixed representative symbol in each of US, HK, CN, JP, DE, FR, BR, IN, and ES.
  - Explicit invalid-symbol behavior for every included Provider x Access Path.
exclusions:
  - Dividend, spinoff, merger, rights, and delisting workflows are separate Harbor contract values and are not mixed into this split comparison.
  - Native provider APIs and candidate tools without a frozen public Provider x Access Path binding.
markets: [US, HK, CN, JP, DE, FR, BR, IN, ES]
asset_types: [EQUITY]
