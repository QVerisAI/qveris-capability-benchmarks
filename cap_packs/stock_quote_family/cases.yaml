cases:
  - case_id: aapl-quote
    cap_id: stock-quote
    question: Return the current quote for AAPL with an as-of timestamp.
    input: {symbol: AAPL}
    negative_control: false
    expected_observations: [symbol, price, timestamp]
    completion_conditions: [symbol, price, timestamp]
    disclosure_limits: []
    applicable_provider_ids: []
  - case_id: invalid-stock
    cap_id: stock-quote
    question: Reject an invalid stock symbol without inventing quote values.
    input: {symbol: NOTASTOCK}
    negative_control: true
    expected_observations: [validation_error]
    completion_conditions: [validation_error]
    disclosure_limits: []
    applicable_provider_ids: []
  - case_id: aapl-freshness-precision
    cap_id: stock-quote
    question: Return an execution-time AAPL quote whose price and timestamp meet the disclosed freshness and precision tolerance.
    input: {symbol: AAPL, max_age_seconds: 900}
    negative_control: false
    expected_observations: [symbol, price, currency, timestamp]
    completion_conditions: [symbol, price, timestamp]
    disclosure_limits: []
    applicable_provider_ids: []
  - case_id: cn-600519-market-coverage
    cap_id: stock-quote
    question: Return the current quote for the canonical SSE security 600519.SH with its market identity and quote timestamp.
    input: {symbol: 600519.SH, market: CN}
    negative_control: false
    expected_observations: [symbol, market, price, currency, timestamp]
    completion_conditions: [symbol, price, timestamp]
    disclosure_limits: []
    applicable_provider_ids: []
  - case_id: cn-600519-agent-contract
    cap_id: stock-quote
    question: Resolve the canonical SSE security 600519.SH and return its current quote and quote timestamp through one fixed tool call.
    input: {symbol: 600519.SH, market: CN, fields: [price, quote_time]}
    negative_control: false
    expected_observations: [symbol, price, timestamp]
    completion_conditions: [symbol, price, timestamp]
    disclosure_limits: []
    applicable_provider_ids: []
