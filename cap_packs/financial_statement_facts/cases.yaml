    cap_id: financial-statement-facts
    question: Return AAPL annual revenue for fiscal year 2025 with the filing identity.
    input: {symbol: AAPL, fiscal_year: 2025}
    negative_control: false
    expected_observations: [symbol, fiscal_year, revenue, filing_date]
    completion_conditions: [symbol, fiscal_year, revenue]
    disclosure_limits: []
    applicable_provider_ids: []
