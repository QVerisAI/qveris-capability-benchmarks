    input: {symbol: AAPL, start_date: 2024-01-01, end_date: 2026-07-31}
    negative_control: false
    expected_observations: [symbol, effective_date, amount, currency]
    completion_conditions: [symbol, effective_date, amount]
    disclosure_limits: []
    applicable_provider_ids: [twelve-data, alpha-vantage, eodhd, massive-stocks]
  - case_id: cn-600519-dividends-fixed-window
