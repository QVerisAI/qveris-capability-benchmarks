name: Live Stock Quote E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-quote-e2e:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/e2e/test_live_stock_quote.py -q
        env:
          RUN_LIVE_STOCK_QUOTE: "1"
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          LIVE_PUBLIC_EVIDENCE_ROOT: ${{ runner.temp }}/stock-quote-public-evidence
      - name: Publish safe terminal summary
        run: |
          manifest=$(find "${{ runner.temp }}/stock-quote-public-evidence" -maxdepth 1 -type f -name 'stock-quote-terminal-manifest-*.json' -print -quit)
          jq -er '(.completed | numbers) as $completed | (.provider_negative | numbers) as $negative | "Live Direct terminal outcomes: completed=\($completed), provider_negative=\($negative)"' "$manifest" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: stock-quote-terminal-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/stock-quote-public-evidence
          if-no-files-found: error
          retention-days: 90
