name: Live Stock Quote v2 Direct E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2]
        binding_id:
          - finnhub-aapl-quote
          - finnhub-invalid-stock
          - eodhd-aapl-quote
          - eodhd-invalid-stock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/e2e/test_live_stock_quote_v2.py -q
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          RUN_LIVE_STOCK_QUOTE_V2: "1"
          STOCK_QUOTE_V2_BINDING_ID: ${{ matrix.binding_id }}
          STOCK_QUOTE_V2_ROUND: ${{ matrix.round }}
          LIVE_PUBLIC_EVIDENCE_ROOT: ${{ runner.temp }}/public-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-quote-v2-terminal-${{ matrix.binding_id }}-round-${{ matrix.round }}
          path: ${{ runner.temp }}/public-evidence
          if-no-files-found: error
