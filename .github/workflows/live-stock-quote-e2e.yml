name: Live Stock Quote E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-quote-e2e:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/e2e/test_live_stock_quote.py -q
        env:
          RUN_LIVE_STOCK_QUOTE: "1"
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
