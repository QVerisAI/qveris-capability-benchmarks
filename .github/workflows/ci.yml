name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering commit
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Reject changes to immutable release directories
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          changed_dirs=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- releases/ | awk -F/ 'NF >= 2 {print $1 "/" $2}' | sort -u)
          for release_dir in $changed_dirs; do
            if git cat-file -e "$BASE_SHA:$release_dir" 2>/dev/null; then
              case "$release_dir" in
                releases/etf-holdings-2026-q3-v1|releases/financial-statements-2026-q3-v1|releases/financial-statements-2026-q3-v2|releases/financial-statements-2026-q3-v3|releases/sec-filing-evidence-2026-q3-v1|releases/sec-filing-evidence-2026-q3-v2|releases/sec-filing-evidence-2026-q3-v3|releases/stock-quote-2026-q3-v2|releases/stock-quote-family-2026-q3-v1|releases/stock-quote-smoke-2026-q3-v1)
                  if ! git cat-file -e "$GITHUB_SHA:$release_dir" 2>/dev/null; then
                    continue
                  fi
                  ;;
              esac
              echo "immutable release directory changed: $release_dir" >&2
              exit 1
            fi
          done
      - name: Install the pinned uv bootstrap
        run: |
          uv_wheel="/tmp/uv-0.12.2-py3-none-manylinux_2_17_x86_64.whl"
          curl --fail --location --retry 3 --output "$uv_wheel" "https://files.pythonhosted.org/packages/a7/fe/a87be2a492440945e745b0dc81aef7fea9730d8194af88d854b7641f5ddf/uv-0.12.2-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          echo "3a8d93d1fe019561b70494a8e1332492afb5f14dadc33d5239569d0964164d10  $uv_wheel" | sha256sum --check
          python3.12 -m pip install --user --disable-pip-version-check --no-deps --no-index "$uv_wheel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run qveris-bench schema export --check
      - name: Replay every committed release offline
        run: |
          shopt -s nullglob
          for release_dir in releases/*; do
            uv run qveris-bench release replay "$release_dir"
          done
