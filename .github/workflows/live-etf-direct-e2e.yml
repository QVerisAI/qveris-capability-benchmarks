name: Live ETF Direct E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
        binding_id:
          - alpha-vantage-spy-holdings
          - alpha-vantage-invalid-etf
          - fiu-spy-holdings
          - fiu-invalid-etf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: |
          uv run qveris-bench qveris execute \
            --binding-id ${{ matrix.binding_id }} \
            --raw-artifact-dir "$RUNNER_TEMP/qveris-raw"
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
