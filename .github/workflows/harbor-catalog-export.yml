name: harbor-catalog-export

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: harbor-catalog-export
    env:
      QVERIS_HARBOR_EXPLORE_KEY: ${{ secrets.QVERIS_HARBOR_EXPLORE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Harbor catalog and contracts
        run: python scripts/export_harbor_catalog.py --output .harbor-snapshots/catalog
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-catalog
          path: .harbor-snapshots/catalog
          if-no-files-found: error
