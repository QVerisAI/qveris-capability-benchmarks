name: Live Wind Native MCP E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wind-native-mcp-e2e:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/e2e/test_live_wind_native_mcp.py -q
        env:
          RUN_LIVE_WIND_NATIVE_MCP: "1"
          WIND_API_KEY: ${{ secrets.WIND_MCP_API_KEY }}
          LIVE_PUBLIC_EVIDENCE_ROOT: ${{ runner.temp }}/wind-native-mcp-public-evidence
      - name: Publish safe terminal summary
        run: |
          manifest=$(find "${{ runner.temp }}/wind-native-mcp-public-evidence" -maxdepth 1 -type f -name 'wind-native-mcp-terminal-manifest-*.json' -print -quit)
          jq -er '(.completed | numbers) as $completed | (.provider_negative | numbers) as $negative | "Live native MCP terminal outcomes: completed=\($completed), provider_negative=\($negative)"' "$manifest" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: wind-native-mcp-terminal-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/wind-native-mcp-public-evidence
          if-no-files-found: error
          retention-days: 90
