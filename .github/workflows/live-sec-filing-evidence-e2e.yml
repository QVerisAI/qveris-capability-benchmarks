name: Live SEC Filing Evidence Direct E2E

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Persist value-free response shapes instead of terminal outcomes.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
        binding_id:
          - massive-stocks-aapl-risk
          - massive-stocks-invalid-filing-type
          - massive-stocks-aapl-us-market-coverage
          - massive-stocks-cik-canonical-identifier
          - massive-stocks-aapl-agent-contract
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/e2e/test_live_sec_filing_evidence.py -q
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          RUN_LIVE_SEC_FILING_EVIDENCE: "1"
          SEC_EVIDENCE_BINDING_ID: ${{ matrix.binding_id }}
          SEC_EVIDENCE_ROUND: ${{ matrix.round }}
          LIVE_PUBLIC_EVIDENCE_ROOT: ${{ runner.temp }}/public-evidence
          SEC_EVIDENCE_PROBE: ${{ inputs.probe && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-evidence-terminal-${{ matrix.binding_id }}-round-${{ matrix.round }}
          path: ${{ runner.temp }}/public-evidence
          if-no-files-found: error
