name: Live Financial Statement Facts Direct E2E

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Persist value-free response shapes instead of terminal outcomes.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
        binding_id:
          - fmp-income-statement-aapl-revenue
          - fmp-income-statement-invalid-period
          - sec-gov-company-facts-aapl-revenue
          - sec-gov-company-facts-invalid-period
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/e2e/test_live_financial_statement_facts.py -q
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          RUN_LIVE_FINANCIAL_STATEMENT_FACTS: "1"
          FSF_BINDING_ID: ${{ matrix.binding_id }}
          FSF_ROUND: ${{ matrix.round }}
          LIVE_PUBLIC_EVIDENCE_ROOT: ${{ runner.temp }}/public-evidence
          FSF_PROBE: ${{ inputs.probe && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsf-terminal-${{ matrix.binding_id }}-round-${{ matrix.round }}
          path: ${{ runner.temp }}/public-evidence
          if-no-files-found: error
