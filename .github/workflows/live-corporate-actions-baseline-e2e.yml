name: Live Corporate Actions Baseline E2E

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  direct:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-live-corporate-actions-baseline'
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
        binding_id:
          - eodhd-us-aapl-split-baseline
          - eodhd-invalid-corporate-actions-symbol-v2
          - twelve-data-us-aapl-split-baseline
          - twelve-data-invalid-corporate-actions-symbol-v2
          - alpha-vantage-us-aapl-split-baseline
          - alpha-vantage-invalid-corporate-actions-symbol-v2
          - massive-us-aapl-split-baseline
          - massive-invalid-corporate-actions-symbol-v2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/e2e/test_live_corporate_actions_v2.py -q
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          RUN_LIVE_CORPORATE_ACTIONS: "1"
          CORPORATE_ACTIONS_SUITE: baseline
          CORPORATE_ACTIONS_BINDING_ID: ${{ matrix.binding_id }}
          CORPORATE_ACTIONS_ROUND: ${{ matrix.round }}
          LIVE_PUBLIC_EVIDENCE_ROOT: ${{ runner.temp }}/public-evidence
          LIVE_RAW_EVIDENCE_ROOT: ${{ runner.temp }}/private-raw-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-actions-baseline-${{ matrix.binding_id }}-round-${{ matrix.round }}
          path: ${{ runner.temp }}/public-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-corporate-actions-baseline-${{ matrix.binding_id }}-round-${{ matrix.round }}
          path: ${{ runner.temp }}/private-raw-evidence
          if-no-files-found: error
          retention-days: 30
