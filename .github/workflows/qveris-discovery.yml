name: QVeris Discovery

on:
  workflow_dispatch:
    inputs:
      query:
        description: Capability query to search without executing a provider tool.
        required: true
        default: ETF holdings constituents weights US listed ETF
      limit:
        description: Maximum candidate tools to display.
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    environment: benchmark-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: |
          uv run qveris-bench qveris search \
            --query "$DISCOVERY_QUERY" \
            --limit "$DISCOVERY_LIMIT" \
            --raw-artifact-dir "$RUNNER_TEMP/qveris-raw"
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          DISCOVERY_QUERY: ${{ inputs.query }}
          DISCOVERY_LIMIT: ${{ inputs.limit }}
      - name: Upload private discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qveris-discovery-raw
          path: ${{ runner.temp }}/qveris-raw
          if-no-files-found: error
