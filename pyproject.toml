[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qveris-capability-benchmarks"
version = "0.1.0"
description = "Evidence-first provider capability benchmarks for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "QVeris" }]
keywords = ["ai-agents", "benchmark", "mcp", "providers"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.28.1",
  "mcp>=1.13.0",
  "openai>=1.99.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
]

[project.scripts]
qveris-bench = "qveris_bench.cli:app"

[dependency-groups]
dev = [
  "jsonschema>=4.26.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qveris_bench"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qveris_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
