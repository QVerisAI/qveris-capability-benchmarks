<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1480" viewBox="0 0 760 1480" role="img" aria-labelledby="title desc">
  <title id="title">6 条分红数据 Access Path 公开证据矩阵</title>
  <desc id="desc">分为核心可用性与响应字段丰富度两部分，比较六条 Access Path 的公开证据状态。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#143F74"/><stop offset="0.58" stop-color="#2F78AD"/><stop offset="1" stop-color="#6EB0C2"/></linearGradient>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .title { fill: #fff; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #E2E8F0; font-size: 24px; }
      .section { fill: #143F74; font-size: 29px; font-weight: 800; }
      .provider { fill: #0F172A; font-size: 23px; font-weight: 800; }
      .path { fill: #475569; font-size: 20px; }
      .head { fill: #143F74; font-size: 23px; font-weight: 800; }
      .symbol { font-size: 34px; font-weight: 800; }
      .legend { fill: #334155; font-size: 23px; }
      .note { fill: #475569; font-size: 22px; }
    </style>
